services:
  postgres:
    image: postgres:16
    container_name: linguistic-db
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5439:5432"
    volumes:
      - linguistic_postgres_data:/var/lib/postgresql/data

volumes:
  linguistic_postgres_data:
