services:
  med-api:
    image: ghcr.io/dev-mindware/med-project-api:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: med_api
    restart: always
    ports:
      - "${MED_API_PORT:-4000}:${PORT:-4000}"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - med_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-4000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: med_postgres
    restart: always
    env_file:
      - path: .env
        required: false
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - med_pgdata:/var/lib/postgresql/data
    networks:
      - med_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johndoe} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  med_net:
    driver: bridge

volumes:
  med_pgdata: