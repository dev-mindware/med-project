# ==============================================================================
# 🚀 DOCKER COMPOSE — AMBIENTE DE PRODUÇÃO (API & POSTGRESQL)
# ==============================================================================
# Uso manual no servidor:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# No Dokploy (Source: Docker Raw):
#   O Dokploy gera automaticamente o ficheiro .env a partir da aba Environment.
# ==============================================================================

services:
  med-api:
    image: ghcr.io/dev-mindware/med-project-api:latest
    pull_policy: always
    container_name: med_api_prod
    restart: unless-stopped
    ports:
      - "${PORT:-3009}:3009"
    # No Dokploy o ficheiro chama-se .env; no servidor manual pode ser .env.production
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - med_net_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3009/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: med_postgres_prod
    restart: unless-stopped
    # Sem env_file: o Postgres só precisa destas 3 variáveis,
    # não recebendo secrets de JWT nem o restante da API.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - med_pgdata_prod:/var/lib/postgresql/data
    networks:
      - med_net_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

networks:
  med_net_prod:
    driver: bridge
    name: med_net_prod

volumes:
  med_pgdata_prod:
    name: med_pgdata_prod

