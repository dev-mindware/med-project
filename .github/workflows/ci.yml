name: CI/CD Deploy (GHCR + Dokploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dev-mindware/med-project-api
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9

jobs:
  ci:
    name: CI — Quality, Tests & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: med_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d med_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3009
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/med_test
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters-long
      FRONTEND_URL: http://127.0.0.1:3000

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Static quality gates ──────────────────────────────────────────────
      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema validation
        run: pnpm prisma:validate

      - name: Build
        run: pnpm build

      # ── Dependency security audit ─────────────────────────────────────────
      - name: Security audit (prod deps, high+)
        run: pnpm audit --prod --audit-level=high

      # ── Unit tests ────────────────────────────────────────────────────────
      - name: Unit tests
        run: pnpm test:ci

      # ── E2E smoke tests ───────────────────────────────────────────────────
      - name: Apply DB migrations
        run: pnpm prisma migrate deploy

      - name: Start API (production bundle)
        run: nohup pnpm start:prod > e2e-server.log 2>&1 & echo $! > e2e-server.pid

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3009/ > /tmp/api-root.txt; then exit 0; fi
            sleep 2
          done
          echo "=== API failed to start ==="
          cat e2e-server.log
          exit 1

      - name: Smoke checks (root + docs)
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3009/ | grep -q "Hello World!"
          curl --fail --silent http://127.0.0.1:3009/api/docs > /tmp/api-docs.html
          test -s /tmp/api-docs.html

      - name: E2E test suite
        run: pnpm test:e2e:ci

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-logs
          path: api/e2e-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API
        if: always()
        run: |
          if test -f e2e-server.pid; then kill "$(cat e2e-server.pid)" || true; fi

  build-and-push-image:
    name: Build & Push Image to GHCR
    # Só corre em push para main (não em PRs)
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Trigger Dokploy Redeploy
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy webhook
        run: |
          echo "Triggering redeploy on Dokploy..."
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" -f