name: CI / Quality, Test & Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9

jobs:
  quality:
    name: Static Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm prisma:validate
      - run: pnpm build

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test -- --runInBand

  e2e:
    name: API E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: med_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d med_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/med_test
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters-long
      FRONTEND_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm build

      - name: Start API
        run: nohup pnpm start:prod > e2e-server.log 2>&1 & echo $! > e2e-server.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/ > /tmp/api-root.txt; then
              exit 0
            fi
            sleep 2
          done
          cat e2e-server.log
          exit 1

      - name: Execute API smoke checks
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:4000/ | grep -q "Hello World!"
          curl --fail --silent http://127.0.0.1:4000/api/docs > /tmp/api-docs.html
          test -s /tmp/api-docs.html

      - name: Run E2E test suite
        run: pnpm test:e2e -- --runInBand

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-logs
          path: api/e2e-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API
        if: always()
        run: |
          if test -f e2e-server.pid; then
            kill "$(cat e2e-server.pid)" || true
          fi

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level=high
